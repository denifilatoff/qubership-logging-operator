<store>
  @type prometheus
  @id output_metrics_total_messages
  <metric>
    name fluentd_output_num_records_total
    type counter
    desc The total number of outgoing records
    <labels>
      hostname "${hostname}"
    </labels>
  </metric>
</store>

<store>
  @type prometheus
  <metric>
    name fluentd_build_info
    type gauge
    desc Build info
    key 1
    initialized true
    <labels>
      # renovate: datasource=github-releases depName=Netcracker/qubership-fluentd versioning=loose
      version 1.19.3-2
    </labels>
  </metric>
</store>
