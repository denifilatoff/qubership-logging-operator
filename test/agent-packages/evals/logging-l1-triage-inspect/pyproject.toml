[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logging-l1-triage-inspect"
version = "0.0.0"
description = "L1 triage eval (inspect-ai port) — registers the claude-agent ModelAPI via an inspect entry point."
requires-python = ">=3.11"

[tool.setuptools]
# The eval source lives in the `harness` package; install it so the registry
# shim is importable as a package module for the entry point to load.
packages = ["harness"]

# Inspect imports this entry point before resolving any model name. Importing
# `harness.registry` runs its top-level `from . import provider`, registering
# the custom `claude-agent` ModelAPI in time for the primary model and the
# grader role.
[project.entry-points.inspect_ai]
logging_l1_triage = "harness.registry:provider"
