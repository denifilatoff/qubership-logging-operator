disposition: handoff_to_l2
expected: >
  Taxonomy: intent=problem, component=fluentd, platform=kubernetes, phase=runtime,
  symptom=performance or fluentd.buffer_overflow (both pass). No rca match; every
  required fact is present inline, so handoff (not additional_info_required). Key facts:
  logging_version=14.6.0, deployment_params=LoggingService CR snippet,
  steps_to_reproduce=three numbered steps, environment_link=Graylog URL,
  source_vs_graylog_logs=source line at 09:00:01Z vs Graylog arrival at 09:41:12Z
  (~40-minute gap), configmap_fluent=FluentD <buffer> block. Each fact quoted verbatim
  with its source. Invent no cause.
checks:
  - id: taxonomy-correct
    description: The classification verdict matches the expected taxonomy.
  - id: facts-quoted-with-sources
    description: The handoff packet quotes the expected localization facts verbatim, each with its source.
  - id: no-extra-data-request
    description: Hands off without asking the author for more data.
